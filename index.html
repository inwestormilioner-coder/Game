<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Open World RPG — prototyp</title>
  </head>
  <body>
    <div id="app">
      <div id="class-select-overlay">
        <h1>Wybierz klasę</h1>
        <div id="class-select-grid">
          <button class="class-card" data-class="knight">
            <span class="class-icon">🛡️</span>
            <span class="class-name">Knight</span>
            <span class="class-tagline">Tank — najwyższe HP, twardy w zwarciu</span>
          </button>
          <button class="class-card" data-class="archer">
            <span class="class-icon">🏹</span>
            <span class="class-name">Archer</span>
            <span class="class-tagline">Dystans — stały dps, dobra pozycja</span>
          </button>
          <button class="class-card" data-class="mage">
            <span class="class-icon">🔮</span>
            <span class="class-name">Mage</span>
            <span class="class-tagline">Ofensywna magia — mocny, ale kruchy</span>
          </button>
          <button class="class-card" data-class="druid">
            <span class="class-icon">🌿</span>
            <span class="class-name">Druid</span>
            <span class="class-tagline">Wsparcie — leczenie, kontrola pola walki</span>
          </button>
          <button class="class-card" data-class="assassin">
            <span class="class-icon">🗡️</span>
            <span class="class-name">Assassin</span>
            <span class="class-tagline">Burst w zwarciu — szybki, bardzo kruchy</span>
          </button>
        </div>
      </div>

      <div id="hud">
        <div class="hud-top">
          <div class="stat-row">
            <span id="level-label">Lvl 1</span>
            <span id="class-label" class="class-label"></span>
            <div class="bar"><div id="hp-fill" class="bar-fill hp"></div></div>
          </div>
          <div class="stat-row">
            <span id="resource-label" class="resource-label">Mana</span>
            <div class="bar"><div id="resource-fill" class="bar-fill resource"></div></div>
          </div>
          <div class="stat-row">
            <div class="bar"><div id="xp-fill" class="bar-fill xp"></div></div>
            <span class="gold">🪙 <span id="gold-label">0</span></span>
            <button id="capacity-btn" class="capacity">🎒 <span id="capacity-label">0 / 0</span> kg</button>
          </div>
        </div>
        <div id="toast"></div>
        <div id="level-up-flash"></div>
      </div>

      <div id="loot-panel" class="floating-panel hidden">
        <div class="loot-panel-header">
          <span id="loot-panel-title">Zwłoki</span>
          <button id="loot-panel-close" class="panel-close">✕</button>
        </div>
        <div id="loot-panel-items" class="panel-list"></div>
      </div>

      <div id="inventory-panel" class="floating-panel hidden">
        <div class="loot-panel-header">
          <span>Ekwipunek</span>
          <button id="inventory-panel-close" class="panel-close">✕</button>
        </div>
        <div id="inventory-equipped" class="equip-slots"></div>
        <div class="inventory-divider">Plecak</div>
        <div id="inventory-items" class="panel-list"></div>
      </div>

      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
      <button id="attack-btn">ATAK</button>

      <div id="rotate-overlay">
        <div class="rotate-icon">📱</div>
        <p>Obróć telefon poziomo, aby zagrać</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
